# NOTE: Phinx YAML cannot read PHP define() values from config.php.
# Use phinx.php instead (vendor/bin/phinx -c phinx.php migrate).
paths:
  migrations: _non_prod/db/migrations
  seeds: _non_prod/db/seeds

environments:
  default_migration_table: phinxlog
  default_database: development
  development:
    adapter: mysql
    host: localhost
    name: VOTRE_NOM_BDD_PROFREEHOST
    user: VOTRE_USER_PROFREEHOST
    pass: VOTRE_MDP_PROFREEHOST
    port: 3306
    charset: utf8mb4
    collation: utf8mb4_unicode_ci
